; The second MIDI script miditest_alt.cc runs against: everything config/midi.ini leaves at
; its default, changed. Not a template for users -- config/midi.ini is.
[midi]
channel        = omni
note_priority  = last
legato         = on
portamento     = t20
bend_range     = 7
sustain        = off
cc_smoothing   = 0
; Sum: this suite checks the offset maths with bindings (shared / takeover are
; miditest_pickup.cc's).
pickup         = sum

[plaits]
timbre         = cc 3

[bind]
velocity   = level
aftertouch = timbre 50%
