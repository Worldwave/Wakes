# Every PR to main, and every push to main, that touches a build input: build both
# configs, run the host suites, gate on check_image.py, and put the size diff in the
# run's summary. Administrative changes (see `paths`) run nothing. Tags always build
# (release.yml), and workflow_dispatch builds on demand.
name: ci

on:
  pull_request:
    branches: [main]
    paths: &build-inputs
      # Everything triggers a build unless it is named below as administrative, so a
      # new build input can never be skipped by accident. Later patterns win.
      - "**"
      # Administrative: nothing the build, the host suites or the checks read.
      - "!**.md"
      - "!LICENSE"
      - "!LICENSES/**"
      - "!NOTICE"
      - "!.gitignore"
      - "!.vscode/**"
      - "!.github/ISSUE_TEMPLATE/**"
      - "!tools/console-log.py"
      - "!tools/plaits-bench/**"
  push:
    branches: [main]
    paths: *build-inputs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A new push to a PR supersedes the old run; runs on main each keep their record.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      # PR: the tip of main it merges into -- actions/checkout builds the merge commit,
      # so the diff is exactly what merging adds. Push: the previous tip of main.
      base-ref: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      base-label: ${{ github.event_name == 'pull_request' && github.base_ref || 'previous main' }}
