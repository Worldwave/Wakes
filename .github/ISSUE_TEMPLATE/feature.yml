name: Feature
description: A new capability, or a change to how something works on purpose.
title: "FEATURE: "
labels: ["feature"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What you want, in a sentence or two.
      placeholder: >-
        Holding FFWD while the clock runs should drive Marbles' clock at the burst
        subdivision, so the sequence itself speeds up.
    validations:
      required: true

  - type: dropdown
    id: page
    attributes:
      label: Module / Page
      description: Where it would live. Pick every one that applies. Names as in docs/UI-PAGES.md.
      multiple: true
      options:
        - PLAITS · BASE
        - PLAITS · SHIFT (•• held)
        - PLAITS · SETTINGS
        - MARBLES · t BASE
        - MARBLES · t SHIFT (•• held)
        - MARBLES · X BASE
        - MARBLES · X SHIFT (•• held)
        - MARBLES · SETTINGS (Y)
        - Power, STANDBY or battery display
        - Not page-specific / not sure
    validations:
      required: false

  - type: textarea
    id: current
    attributes:
      label: Current Behaviour
      description: What the firmware does today, if anything, in the situation this is about.
      placeholder: |
        * FFWD while running re-triggers the note Marbles is holding: a roll at the burst
          division, not a faster sequence.
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed Behaviour
      description: What should happen instead, step by step if it involves a gesture.
      placeholder: |
        * While FFWD is held, Marbles' clock runs at the burst subdivision, so each tick
          advances the sequence.
        * Letting go returns to the normal clock, with the beat where it would have been.
    validations:
      required: true

  - type: textarea
    id: controls
    attributes:
      label: Controls
      description: >-
        Which buttons, faders or gesture it would use, if you have an idea. Free
        combinations are scarce (see "Unassigned" in docs/UI-PAGES.md), and the only
        long press on a T button is Unpatch, so a proposal that needs another long
        press will need a different gesture.
      placeholder: |
        * FFWD held, as now. No new control.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version
      description: The release you are using, if the request is about something you've seen on hardware.
      placeholder: v0.7.2
    validations:
      required: false
