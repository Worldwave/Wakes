# wakes-sp1 M0 — the safety floor.
#
# Deliberately minimal. No USB, no console, no audio, no ADC. Every option
# here either keeps the device recoverable or is required to boot at all.
# Things are ADDED in later milestones, never removed to fix a build.

# ---- Recoverability ----
# The watchdog is the final backstop for a hang on a device with no reset pin.
CONFIG_WATCHDOG=y
# k_sys_fatal_error_handler() in main.c turns any fault into a cold reboot.
CONFIG_REBOOT=y

# ---- Fault containment ----
# HW_STACK_PROTECTION reprograms the MPU stack guard on every context switch.
# sp1-tape-looper measured that at ~1 % at the corner and turned it off in
# favour of the cheaper STACK_SENTINEL canary (which Kconfig excludes while
# MPU_STACK_GUARD is on). M0 has CPU to spare and no audio deadline yet, so
# keep the stronger guard here and revisit at M2 when the deadline is real.
CONFIG_HW_STACK_PROTECTION=y

# ---- USB CDC ACM console (M1c) ----
# Exists to make two things possible that are miserable blind: calibrating the
# battery divider, and building the button-ladder threshold tables in M1d.
#
# device_next rather than the legacy CONFIG_USB_DEVICE_STACK: legacy is smaller but
# deprecated, mass storage later would need device_next anyway, and this is the path
# sp1-tape-looper proved on this board and this Zephyr version.
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
# The app owns the single USBD context; do not let the CDC SYS_INIT build a second
# private one that would fight for the controller.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_HWINFO=y
# The device's identity (VID/PID, names, bMaxPower) is CONFIG_SP1_USB_* in firmware/Kconfig
# since M5a, set by src/sp1_usbd.c rather than Zephyr's sample helper.

# ---- USB-MIDI (M5a) ----
# feldd's MIDI 1.0 class (third_party/feldd) queues its transmit side in a ring buffer.
CONFIG_RING_BUFFER=y

CONFIG_LOG=n
CONFIG_ASSERT=n

# The USB stack's init and printf need more main stack than the bare power build.
# 3 KB from M3 (was 2 KB): main now uses the FPU (fader smoothing), so every exception
# taken on its stack carries the extended FP frame, and it calls printk with more args.
CONFIG_MAIN_STACK_SIZE=3072

# ---- Clocking ----
# Matches what the bootloader leaves behind. Do not change without reading
# docs/SAFETY.md -- re-initialising bootloader-owned clocks is on the "do not"
# list for this board.
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y


# ---- LED rows on hardware PWM (M1a) ----
# Hardware PWM costs no CPU (EasyDMA), unlike the software PWM sp1-tape-looper
# uses -- which needed a zero-latency IRQ to stop flicker and would compete with
# the audio deadline from M2 on. Do not replace this with a software PWM.
CONFIG_PWM=y
CONFIG_PWM_NRFX=y

# ---- Battery voltage (M1b) ----
# SAADC on AIN4. Only the battery channel for now; the faders join in M1c.
CONFIG_ADC=y

# ---- Output naming ----
# Renames build/zephyr/zephyr.{elf,bin,hex,map,...} to wakes-sp1.{elf,bin,hex,map,...}.
# The build/zephyr/ subdirectory itself is unaffected -- that name comes from the
# Zephyr CMake target, not this option.
CONFIG_KERNEL_BIN_NAME="wakes-sp1"

# ---- Audio output (M2) ----
# I2C to the two codecs (CS42L42 headphone at 0x48, TAS2505 speaker amp at 0x18),
# and the I2S stream as a CLOCK SLAVE on both clocks -- see sp1_audio.h for the
# topology. Same three options sp1-tape-looper proved on this board.
CONFIG_I2C=y
CONFIG_I2S=y
CONFIG_I2S_NRFX=y
# ---- latency (M5b, Adara: "over 30 ms is a no-go"; #32: 10 ms) ----
# Sound leaves Wakes (queued blocks + 3) x the block length after what caused it: one block
# to place a MIDI message on time, the queued blocks, the DMA's next one and the one
# playing (sp1_audio.c). 5 ms x 4 queued was 35 ms, 5 ms x 2 was 25 ms (v0.5.0), and 2 ms x 2
# is 10 ms (#32), affordable since Plaits renders 24-sample blocks. The block length is
# CONFIG_SP1_AUDIO_BLOCK_FRAMES (firmware/Kconfig). What it costs: a block that runs long --
# an engine change, USB enumeration -- has (queued + 1) x 2 = 6 ms before the output runs dry.
CONFIG_I2S_NRFX_TX_BLOCK_COUNT=2

# ---- CPU per thread, for the log (M5b diagnostics; src/sp1_threads.h) ----
# The audio sections cannot see what preempts them -- the USB stack runs above audio -- so
# every thread's share is counted at each context switch, on the DWT cycle counter (the
# kernel's own tick would be 30 us coarse). A few cycles per switch.
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_RUNTIME_STATS_USE_TIMING_FUNCTIONS=y
CONFIG_TIMING_FUNCTIONS=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y

# Floating-point unit. Nothing in M2 uses float -- the tone and the meter are
# integer-only on purpose -- but Plaits is float throughout from M3. Turning the FPU
# on HERE means M3 changes one thing (the synth), not two (the synth and the
# FP context-switch behaviour).
CONFIG_FPU=y
# Preserve FP registers across context switches. CONFIG_FPU alone is Zephyr's
# UNSHARED mode: FP state is not saved when threads switch. Plaits (float) will run in
# the audio thread, and any float in main, USB or an ISR would silently corrupt it --
# and with the hard-float ABI the compiler may use VFP registers for plain data moves
# too. Set now, with the FPU, so M3 does not inherit a latent corruption bug.
CONFIG_FPU_SHARING=y

# ---- M3: the Plaits voice ----
# The fallback switch: n = the M2 test tone, and no Plaits code is built at all.
CONFIG_SP1_PLAITS=y
# Plaits is C++ (no exceptions, no RTTI -- the Zephyr defaults) and needs <algorithm>
# and <cmath>, which the minimal C++ library does not provide.
CONFIG_CPP=y
CONFIG_STD_CPP14=y
CONFIG_GLIBCXX_LIBCPP=y
# ⚠️ The audio thread runs at K_PRIO_PREEMPT(0) and MUST outrank main, so main moves
# to 1. From M3 the audio work is ~half the CPU; at equal priority the ADC scan and
# every printk would compete with the audio deadline. See sp1_audio.h.
CONFIG_MAIN_THREAD_PRIORITY=1
