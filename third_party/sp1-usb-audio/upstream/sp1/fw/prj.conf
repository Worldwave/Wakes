CONFIG_MAIN_THREAD_PRIORITY=7
CONFIG_MAIN_STACK_SIZE=2048

CONFIG_FPU=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_I2S=y
CONFIG_I2S_NRFX=y
CONFIG_PWM=y
CONFIG_ADC=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_AUDIO2_CLASS=y
CONFIG_UDC_ENABLE_SOF=y

# Zephyr's test VID/PID. Use your own for anything you distribute.
CONFIG_SAMPLE_USBD_VID=0x2fe3
CONFIG_SAMPLE_USBD_PID=0x0001
CONFIG_SAMPLE_USBD_PRODUCT="SP-1 USB audio example"
CONFIG_SAMPLE_USBD_MAX_POWER=50

CONFIG_HWINFO=y
CONFIG_PRINTK=y
CONFIG_LOG=n

CONFIG_REBOOT=y
CONFIG_STACK_SENTINEL=y
CONFIG_HW_STACK_PROTECTION=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y
