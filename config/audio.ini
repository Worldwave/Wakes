; =====================================================================================
;  Wakes — the audio settings
; =====================================================================================
;
;  How Wakes' sound leaves the device. Edit it in your fork, build (or let CI build) and
;  flash: the build reads this file and FAILS with the line number if something in it is
;  wrong, so a typo can never become a firmware that silently ignores your setting.
;
;  Lines starting with ; are comments. Every setting can be left out to get its default.


[usb]
;  USB AUDIO OUT. Plugged into a computer, phone or other USB host, Wakes shows up as an
;  audio input ("Wakes Audio Out", or "Wakes" -- the name depends on the host): 48 kHz,
;  16-bit stereo, no driver. It carries what the speaker and headphones get -- the output
;  select (OUT / AUX / OUT+AUX / OUTxAUX) and the drive included. Nothing changes until a
;  host actually takes the audio (records or monitors the input); these settings apply only
;  while it does. Headphones always play.

;  How USB audio out sets its level:
;    parked (default) = while a host takes USB audio, VOL is set to `parked_level` and its
;      buttons do nothing, so a recording's level never depends on where VOL happened to
;      be. When the host stops, VOL goes back to where you left it.
;      Wakes has ONE output level for every output, so parking it parks the headphones
;      (and the speaker, if `speaker = on`) at that level too. That is deliberate: it is
;      the cheapest way to do it. A separate level for USB alone would need a second gain
;      pass over every block of audio (about 0.3 % of the CPU), which Wakes keeps for its
;      engines.
;    vol = VOL moves USB audio out like everything else, like the volume knob of a
;      hardware synth on a mixer track.
level          = parked

;  The level USB audio out is parked at, in dB: one of VOL's steps -- 0, -3, -6, -9, -12,
;  -15, -18, -21, -24, -27 or -30. 0 is full scale, which Wakes' loudest patches (the
;  drive's top steps) reach; -6 leaves a recording some headroom.
parked_level   = -6

;  The speaker while a host takes USB audio:
;    off (default) = quiet: the host is recording, so the room only gets a second copy.
;      It comes back as soon as the host stops taking the audio (or goes to sleep, or the
;      cable is pulled).
;    on = it keeps playing.
speaker        = off
