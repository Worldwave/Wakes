# Zephyr's newer USB device stack and its UAC2 (USB Audio Class 2) function.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_AUDIO2_CLASS=y
# The nRF USBD driver enables its start-of-frame interrupt only with this set.
# The class forwards each SOF to uac2_ops.sof_cb, which sends one packet.
CONFIG_UDC_ENABLE_SOF=y

# Zephyr's test VID/PID. Use your own for anything you distribute.
CONFIG_SAMPLE_USBD_PRODUCT="UAC2 tone sample"
CONFIG_SAMPLE_USBD_MAX_POWER=50

CONFIG_HWINFO=y
CONFIG_PRINTK=y
CONFIG_LOG=n
