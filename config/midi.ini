; =====================================================================================
;  Wakes — the MIDI script
; =====================================================================================
;
;  How Wakes listens to MIDI over USB. Edit it in your fork, build (or let CI build) and
;  flash: the build reads this file and FAILS with the line number if something in it is
;  wrong, so a typo can never become a firmware that silently ignores your setting.
;  Every build also writes a CC chart from this file (Markdown, and a CSV in the
;  midi.guide format) next to the firmware, so your chart always matches your script.
;
;  Lines starting with ; are comments. Every setting can be left out to get its default.
;
;  What MIDI does on Wakes, in short:
;    NOTES play Plaits, one at a time (the newest, by default). A note-on strikes TRIG and
;    opens LEVEL -- as far as the note's velocity says, by default ([bind] below) -- and a
;    note-off lets it close through Plaits' own low-pass gate. Pitch is added to FREQUENCY
;    like a V/Oct cable, with note 60 (C4) adding nothing: with F1 on its centre detent the
;    keyboard plays at its real pitch, and F1 transposes. From the first note or CC until
;    you unplug, FREQUENCY's scale quantizer stands aside and F1's centre detent widens
;    to 10 %.
;    CCs: each parameter below can be given a CC, which moves it like a second hand on its
;    fader -- how the two hands share it is `pickup`, below. Nothing moves until you aim
;    something at it.
;    CLOCK: Marbles follows the host's MIDI clock and Start / Continue / Stop (`clock`).
;    UNPLUG: notes are released, the bend and every offset go back to neutral, and a
;    Marbles the host was clocking stops and has its own clock again.
;
;  docs/MIDI.md has the whole story.
;
;  Credit: the way Wakes plays notes -- which held note sounds, legato, portamento, the
;  sustain pedal -- is ported from Mutable Instruments Yarns (Emilie Gillet, MIT): its
;  monophonic part, with its note stack, its legato modes and its portamento curves and
;  table. Everything Yarns does that matters here is explained below, so you never need
;  its manual to read this file. Attribution in NOTICE.

[midi]
; Which MIDI channel Wakes listens on: 1-16, or omni (every channel). Clock and transport
; have no channel, so Marbles follows them whatever this says.
channel        = 1

; Plaits plays one note at a time. When several keys are held, which one you hear:
;   last = the most recently pressed key (most mono synths).
;   low  = the lowest key held -- a bass line that ignores notes played above it.
;   high = the highest key held -- a lead that ignores notes played below it.
; Wakes remembers up to 12 held keys. Let go of the one sounding and the next by the same
; rule takes over if it is still held (with `last`: the one pressed before it).
note_priority  = last

; What happens when a new note takes over while another key is still held:
;   off  = it strikes TRIG again, like a new note, and so does falling back to a key still
;          held. Every note is articulated. Portamento (below) applies to every note.
;   on   = it does NOT strike: the pitch moves to the new note while the sound carries on,
;          as on a monosynth played legato. Only a note played after letting go of every
;          key strikes. Portamento applies to every note.
;   auto = as on, and portamento ONLY between overlapping notes: play legato to glide,
;          detached to jump straight to the next note (with a strike) -- portamento under
;          your fingers rather than always on.
; The same pitch played again before its note-off -- a sequencer's notes longer than its
; step -- strikes again in off, and is tied into one long note in on and auto. Either way it
; ends at the LAST of its note-offs, not the first.
legato         = off

; Portamento: the pitch glides from one note to the next instead of jumping. 0 = none.
;   t1 .. t50 = constant TIME: every glide takes the same time, whatever the interval.
;               The curve is exponential -- fast at first, then settling into the note,
;               the way an analog glide (a capacitor charging) sounds -- and it lands
;               exactly on the note at the set time.
;   r0 .. r50 = constant RATE: the pitch moves in a straight line at a fixed speed, so a
;               wider interval takes longer. The time below is per octave: a fifth takes
;               7/12 of it, two octaves twice it.
; The scale is steep, finest at the short end. Glide time (t), or time per octave (r):
;   1 ~ 1 ms   5 ~ 6 ms   10 ~ 22 ms   20 ~ 135 ms   30 ~ 0.47 s   40 ~ 1.2 s   50 ~ 2.6 s
; (r0 is under 1 ms per octave: practically instant.)
portamento     = 0

; Pitch bend range in semitones, 0-24. If the host sends its own bend range
; (RPN 0, "pitch bend sensitivity"), Wakes uses the host's until it is unplugged.
bend_range     = 2

; The sustain pedal: cc N, or off. CC 64 is the standard pedal.
sustain        = cc 64

; How long a CC takes to glide to a new value, in milliseconds (0-200). This is what
; turns a CC's steps into a smooth movement instead of zipper noise. Stepped parameters
; (OCTAVE range, MODEL, LENGTH, Y divider) do not glide: a step is the point.
cc_smoothing   = 10

; How a CC and its fader share a parameter. All three use Plaits' own pickup ("catch-up"),
; the one its knobs use after a preset change: a control that does not match the value
; does not make it jump -- moving it moves the value the same way from where it is, a
; little faster or slower, until the two meet and it simply follows.
;
;   sum      = the CC is an OFFSET on top of the fader: fader + CC. A parameter whose
;              middle is neutral reads its CC centred (64 = no change, 0 / 127 = half a
;              travel down / up); any other reads it one-sided (0 = no change, 127 = a
;              whole travel up); TIMBRE / MORPH / HARMONICS follow the engine, and when an
;              engine change flips how one reads, the offset catches up instead of jumping.
;              Unplug and every offset goes back to zero.
;   shared   = the CC and the fader are two hands on ONE value. A CC reads like the fader
;              (0 = the bottom, 127 = the top). Whichever you move takes the value from
;              where the other left it and catches up with your hand.
;   takeover = while MIDI is plugged in, the faders that have a CC here REST, and only the
;              CC moves the parameter (catching up with where the fader left it). Unplug and
;              the faders work again, catching up with where the CC left it.
;
; In shared and takeover the CC moves the parameter itself: the fader LEDs show where the
; host put it, and it stays there when you unplug. A host knob's FIRST value after plugging
; in -- including the snapshot some hosts send when they connect -- only tells Wakes where
; the knob is; nothing moves until you turn it.
; MODEL has no fader, so it is an offset in every setting (see [plaits]), and so are the
; [bind] sources at the end of this file.
pickup         = shared

; MIDI clock and transport into Marbles: on, or off (ignore them).
;   on = from the host's first clock tick (or Start), Marbles' clock IS the host's clock,
;        like a cable in the Eurorack Marbles' CLOCK input. Marbles' RATE fader then picks a
;        ratio of the host's beat instead of a tempo: 1/4, 1/3, 1/2, 2/3, 1, 3/2, 2, 3, 4
;        (Marbles' own table, centre = 1), times 4 or 1/4 with the t range. Start plays from
;        beat 1, Continue carries on, Stop stops; PLAY still works too. MMC Play / Stop
;        (MIDI Machine Control, what the OP-XY sends) work too: with MIDI clock arriving,
;        Play waits for beat 1 like Start; without, it plays Marbles on its own RATE
;        tempo. If the host stops
;        sending clock, Marbles waits for it. Unplug, and Marbles stops and has its own
;        clock again. Song Position Pointer is ignored.
;        A DAW's clock arrives a few ms early or late on every tick: Wakes follows a
;        straight line through the last two beats of ticks, not each tick, so Marbles'
;        beats stay steady (under 1 ms of the +-8 ms in the ticks).
;        Clock alone does not count as MIDI in use: the scale quantizer and F1's detent
;        stay as they are. The FFWD burst follows the host's tempo too.
clock          = on

; How far ahead of the host's clock Marbles runs, in ms (0-200), or auto.
;   Wakes plays every sound about 8.5 ms after the MIDI that caused it (one 2 ms audio
;   block to place the message on time, the audio queued ahead of the output, and Plaits'
;   0.5 ms TRIG delay). Notes cannot be played early, but a clock can: it is steady, so
;   Wakes reads it that far ahead and Marbles' beats leave the output on the host's beat.
;   auto = Wakes' own delay (8.5 ms). A host may send its clock later than its notes
;   (Bitwig does): the console's "MIDI notes vs clock" line measures by how much.
;   Set a number if a recording against your host shows Marbles early or late, and leave
;   your DAW's own clock offset / sync delay for Wakes at 0 -- or set this to 0 and use
;   the DAW's instead. Beat 1 after a Start is the exception: nothing said when it would
;   come, so it sounds on arrival and Marbles is on time from beat 2.
clock_lead     = auto


; -------------------------------------------------------------------------------------
;  The parameters, and which CC moves each one.   name = cc N   (or none)
;
;  CC 0-31 are 14-bit: Wakes also listens to their partner CC N+32 for the fine half of
;  the value, which is how a host sends high-resolution CCs. A host that only sends the
;  coarse half still works. Any other CC is 7-bit (128 steps), smoothed.
;
;  The defaults below use only CC numbers that keyboards and DAWs do not send on their
;  own (the undefined ones, and General Purpose 1-4 = CC 16-19), so out of the box
;  nothing moves until you point something at it. The mod wheel (1), breath (2), foot
;  (4), portamento time (5) and expression (11) are deliberately left free for you.
;
;  Not allowed, because MIDI already uses them: CC 0/32 (bank select), 6/38 and 96-101
;  (data entry and parameter numbers -- needed for the host's bend range), 120-127
;  (channel mode messages), and whatever CC the sustain pedal is on. CC 33-63 are the fine
;  halves of CC 1-31: give the parameter CC N, and N+32 comes with it. A CC may move only
;  one parameter.
;
;  How a CC reads depends on `pickup` (above): in shared and takeover it is the fader's
;  position (0 = bottom, 127 = top); in sum it is an offset, centred or one-sided.
; -------------------------------------------------------------------------------------

[plaits]
; BASE page
timbre               = cc 3
morph                = cc 9
harmonics            = cc 14
frequency            = cc 15
; SHIFT page: the four attenuverters
fm_attenuverter        = cc 20
timbre_attenuverter    = cc 21
morph_attenuverter     = cc 22
harmonics_attenuverter = cc 23
; SETTINGS page
lpg_colour           = cc 24
lpg_decay            = cc 25
level                = cc 26          ; can connect LEVEL, as pushing the fader up does
octave_range         = cc 102         ; stepped: whole range modes
; Not on a fader at all: which engine plays, as an offset from the one T2/T3 selected,
; up through the filled slots of config/engines.csv (0 = the selected engine, 127 = the
; last slot). A change plays the engine flash, as T2/T3 do, and MIDI changes the engine at
; most every 50 ms -- each change costs the audio a moment, as a T2/T3 press does.
model                = cc 105

[marbles]
; t page
rate                 = cc 27
t_bias               = cc 16
jitter               = cc 85
deja_vu              = cc 31
; t SHIFT page
gate_length          = cc 17
gate_length_random   = cc 86
length               = cc 103         ; stepped
; X page
spread               = cc 28
x_bias               = cc 29
steps                = cc 30
; SETTINGS (Y) page
y_spread             = cc 18
y_bias               = cc 19
y_steps              = cc 87
y_divider            = cc 104         ; stepped


; -------------------------------------------------------------------------------------
;  Extra sources.
;
;    velocity   = <parameter> [depth%]    how hard each note was played
;    aftertouch = <parameter> [depth%]    channel pressure
;
;  <parameter> is any name from the two lists above, and the depth is -100% .. 100%
;  (default 100%). The source pushes that parameter up from where it is, by up to its
;  whole travel at 100% -- an offset, whatever `pickup` says.
;
;  Aimed at `level`, it sets how far each note opens LEVEL instead, which Plaits also reads
;  as accent: soft notes are quieter AND darker, as on the module with a velocity CV in
;  LEVEL. At 100% the hardest note opens it fully and the softest barely at all; at 50%
;  the softest still opens it half way. It shapes MIDI notes only: once a note's release
;  has ended, LEVEL is the fader's again, as it is for RWD, FFWD and Marbles' TRIG.
;  To play every note at full LEVEL, comment out the velocity line.
;
;  You can also do this on the host instead: most DAWs can turn velocity or pressure
;  into a CC, and aim it at the CC of the parameter you want.
; -------------------------------------------------------------------------------------

[bind]
velocity   = level
; aftertouch = timbre 50%
